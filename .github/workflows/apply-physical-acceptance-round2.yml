name: Apply Physical Acceptance Round 2

on:
  push:
    branches:
      - fix/multiplayer-send-ack-arm-local-rest-20260914
    paths:
      - tools/apply_physical_acceptance_round2.py
      - tools/generate_canonical_rest_profile.gd
      - .github/workflows/apply-physical-acceptance-round2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/multiplayer-send-ack-arm-local-rest-20260914

      - name: Apply deterministic source repair
        run: python tools/apply_physical_acceptance_round2.py

      - name: Download Godot 4.5.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 8 --retry-delay 3 --retry-all-errors \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.5.1-stable_linux*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Import project resources and class cache
        run: "$GODOT_BIN" --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Generate canonical local-rest profile
        run: "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tools/generate_canonical_rest_profile.gd

      - name: Parse repaired runtimes
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --check-only -s res://scripts/pocketpt/pocketpt_lobby_client.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --check-only -s res://scripts/pocketpt/pocketpt_animation_rest_retarget.gd

      - name: Run targeted regressions
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tests/pocketpt_multiplayer_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tests/pocketpt_multiplayer_diagnostic_payload_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tests/pocketpt_animation_rest_retarget_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tests/pocketpt_phone_flow_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tests/pocketpt_live_mocap_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tests/player_visual_facing_test.gd

      - name: Commit verified repair source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/pocketpt/pocketpt_lobby_client.gd \
            scripts/pocketpt/pocketpt_animation_rest_retarget.gd \
            resources/pocketpt/canonical_avatar_rest_profile.json \
            tests/pocketpt_multiplayer_test.gd \
            tests/pocketpt_animation_rest_retarget_test.gd \
            .github/workflows/avatar-rest-retarget-ci.yml
          git commit -m "Fix WebSocket send acknowledgement and local-rest arm retarget"
          git push origin HEAD:fix/multiplayer-send-ack-arm-local-rest-20260914
