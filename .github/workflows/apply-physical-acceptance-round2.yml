name: Apply Physical Acceptance Round 2

on:
  push:
    branches:
      - fix/multiplayer-send-ack-arm-local-rest-20260914
    paths:
      - tools/apply_physical_acceptance_round2.py
      - tools/generate_canonical_rest_profile.gd
      - .github/workflows/apply-physical-acceptance-round2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/multiplayer-send-ack-arm-local-rest-20260914

      - name: Apply deterministic source repair
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_physical_acceptance_round2.py
          python - <<'PY'
          from pathlib import Path

          lobby = Path('scripts/pocketpt/pocketpt_lobby_client.gd')
          text = lobby.read_text(encoding='utf-8')
          old = 'var ok := event.get("ok") == true'
          new = 'var ok: bool = event.get("ok") == true'
          if old not in text:
              raise SystemExit('expected bool inference line missing')
          text = text.replace(old, new, 1)
          old = '''\tif not OS.has_feature("web") or not Engine.has_singleton("JavaScriptBridge"):\n\t\t_record_state_send_result(next_sequence, false, attempt_at_ms, "JAVASCRIPT_BRIDGE_UNAVAILABLE")\n\t\treturn false'''
          new = '''\tif not OS.has_feature("web") or not Engine.has_singleton("JavaScriptBridge"):\n\t\t# Desktop/headless has no browser transport. This is expected and must not\n\t\t# contaminate snapshot/receive diagnostics with a Web-only failure.\n\t\treturn false'''
          if old not in text:
              raise SystemExit('expected non-web transport block missing')
          lobby.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/pocketpt_multiplayer_test.gd')
          text = test.read_text(encoding='utf-8')
          old = '''func _test_snapshot_state_leave_reconnect_shape() -> void:\n\tvar self_player :='''
          new = '''func _test_snapshot_state_leave_reconnect_shape() -> void:\n\t# Prior transport-failure coverage intentionally records FIRST FAILURE. Clear\n\t# it so stale-sequence assertions test only the receive path.\n\tlobby.multiplayer_state["firstFailure"] = "NONE"\n\tlobby.multiplayer_state["lastError"] = ""\n\tvar self_player :='''
          if old not in text:
              raise SystemExit('expected multiplayer isolation insertion point missing')
          text = text.replace(old, new, 1)
          old_assert = '''\t_expect(str(lobby.diagnostic_snapshot().get("firstFailure", "NONE")) == "NONE", "stale JSON sequence does not become FIRST FAILURE")'''
          new_assert = '''\tvar stale_failure := str(lobby.diagnostic_snapshot().get("firstFailure", "NONE"))\n\t_expect(stale_failure == "NONE", "stale JSON sequence does not become FIRST FAILURE: %s" % stale_failure)'''
          if old_assert not in text:
              raise SystemExit('expected stale assertion missing')
          test.write_text(text.replace(old_assert, new_assert, 1), encoding='utf-8')

          arm_test = Path('tests/pocketpt_animation_rest_retarget_test.gd')
          text = arm_test.read_text(encoding='utf-8')
          invalid = '''\tfor bone_name in ["LeftArm", "LeftForeArm", "RightArm", "RightForeArm"]:\n\t\tvar q := RestRetarget.canonical_rest_for_bone(bone_name)\n\t\t_expect(absf(q.dot(Quaternion(0.0, 0.0, 0.0, 1.0))) < 0.999, "%s has explicit non-identity canonical rest basis" % bone_name)\n'''
          if invalid not in text:
              raise SystemExit('expected obsolete non-identity arm assertion missing')
          arm_test.write_text(text.replace(invalid, '', 1), encoding='utf-8')
          PY

      - name: Download Godot 4.5.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 8 --retry-delay 3 --retry-all-errors \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.5.1-stable_linux*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Import project resources and class cache
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Generate canonical local-rest profile
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tools/generate_canonical_rest_profile.gd

      - name: Parse repaired runtimes
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --check-only -s res://scripts/pocketpt/pocketpt_lobby_client.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --check-only -s res://scripts/pocketpt/pocketpt_animation_rest_retarget.gd

      - name: Run targeted regressions
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tests/pocketpt_multiplayer_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tests/pocketpt_multiplayer_diagnostic_payload_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tests/pocketpt_animation_rest_retarget_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tests/pocketpt_phone_flow_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tests/pocketpt_live_mocap_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tests/player_visual_facing_test.gd

      - name: Commit verified repair source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          # The patch hardens the permanent CI workflow too, but this job's
          # token intentionally lacks workflows:write. Keep that workflow out
          # of this bot-generated runtime commit; it can be updated separately
          # through normal review if desired.
          git checkout -- .github/workflows/avatar-rest-retarget-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/pocketpt/pocketpt_lobby_client.gd \
            scripts/pocketpt/pocketpt_animation_rest_retarget.gd \
            resources/pocketpt/canonical_avatar_rest_profile.json \
            tests/pocketpt_multiplayer_test.gd \
            tests/pocketpt_animation_rest_retarget_test.gd
          git commit -m "Fix WebSocket send acknowledgement and local-rest arm retarget"
          git push origin HEAD:fix/multiplayer-send-ack-arm-local-rest-20260914
