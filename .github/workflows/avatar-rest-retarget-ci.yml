name: Avatar Rest Retarget Gate

on:
  pull_request:
    paths:
      - "scripts/pocketpt/pocketpt_animation_rest_retarget.gd"
      - "scripts/pocketpt/pocketpt_locomotion_animator.gd"
      - "scripts/pocketpt/pocketpt_remote_player.gd"
      - "resources/pocketpt/canonical_avatar_rest_profile.json"
      - "tests/pocketpt_animation_rest_retarget_test.gd"
      - "export_presets.cfg"
      - ".github/workflows/avatar-rest-retarget-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avatar-rest-retarget-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Godot project
        uses: actions/checkout@v4

      - name: Download Godot 4.5.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 8 --retry-delay 3 --retry-all-errors \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.5.1-stable_linux*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Install Godot Web export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 8 --retry-delay 3 --retry-all-errors \
            -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.5.1.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -R /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          test -f "$TEMPLATE_DIR/web_release.zip"

      - name: Import project resources and class cache
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Parse retarget runtime
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --check-only -s res://scripts/pocketpt/pocketpt_animation_rest_retarget.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --check-only -s res://scripts/pocketpt/pocketpt_locomotion_animator.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --check-only -s res://scripts/pocketpt/pocketpt_remote_player.gd

      - name: Run rest-retarget regression
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tests/pocketpt_animation_rest_retarget_test.gd

      - name: Protect existing movement and multiplayer regressions
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tests/player_visual_facing_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tests/pocketpt_phone_flow_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tests/pocketpt_multiplayer_test.gd

      - name: Verify Web export contains runtime retarget resources
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'res://scripts/pocketpt/pocketpt_animation_rest_retarget.gd' export_presets.cfg
          grep -F 'res://resources/pocketpt/canonical_avatar_rest_profile.json' export_presets.cfg
          rm -rf build/retarget-web-smoke
          mkdir -p build/retarget-web-smoke
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --export-release "Web" build/retarget-web-smoke/index.html
          for file in index.html index.js index.pck index.wasm; do
            test -s "build/retarget-web-smoke/$file"
          done
          echo "Avatar rest-retarget Web export smoke PASS"
