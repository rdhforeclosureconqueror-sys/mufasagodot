name: Apply Live Locomotion Fix V3

on:
  push:
    branches:
      - fix/walk-facing-thriller-20260913
    paths:
      - .github/workflows/apply-live-locomotion-fix-v3.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/walk-facing-thriller-20260913

      - name: Patch facing and Thriller control
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('player.gd')
          t = p.read_text()
          if 'visual_turn_speed' not in t:
              t = t.replace('@export var mat_arrival_distance := 0.35\n', '@export var mat_arrival_distance := 0.35\n@export var visual_turn_speed := 12.0\n', 1)
          if 'avatar_anchor:' not in t:
              t = t.replace('@onready var navigation_agent: NavigationAgent3D = $NavigationAgent3D\n', '@onready var navigation_agent: NavigationAgent3D = $NavigationAgent3D\n@onready var avatar_anchor: Node3D = $avataranchor\n', 1)
          if '_face_visual_direction(direction, delta)' not in t:
              t = t.replace('\tvar target_speed := speed * run_speed_multiplier if effective_mode == LocomotionMode.RUN else speed\n\tif direction.length_squared() > 0.0001:\n\t\tvelocity.x = direction.x * target_speed\n', '\tvar target_speed := speed * run_speed_multiplier if effective_mode == LocomotionMode.RUN else speed\n\tif direction.length_squared() > 0.0001:\n\t\t_face_visual_direction(direction, delta)\n\t\tvelocity.x = direction.x * target_speed\n', 1)
          if 'func _face_visual_direction' not in t:
              helper = '''func _face_visual_direction(world_direction: Vector3, delta: float) -> void:\n\tif avatar_anchor == null:\n\t\treturn\n\tvar local_direction := global_transform.basis.inverse() * world_direction\n\tlocal_direction.y = 0.0\n\tif local_direction.length_squared() <= 0.0001:\n\t\treturn\n\tlocal_direction = local_direction.normalized()\n\tvar target_yaw := atan2(-local_direction.x, -local_direction.z)\n\tavatar_anchor.rotation.y = lerp_angle(avatar_anchor.rotation.y, target_yaw, clampf(visual_turn_speed * delta, 0.0, 1.0))\n\n'''
              t = t.replace('func set_navigation_context(value: String) -> bool:\n', helper + 'func set_navigation_context(value: String) -> bool:\n', 1)
          if '"visualFacingYaw"' not in t:
              t = t.replace('\t\t"physicalMovementObserved": moving,\n\t\t"source": source,\n', '\t\t"physicalMovementObserved": moving,\n\t\t"visualFacingYaw": avatar_anchor.rotation.y if avatar_anchor != null else 0.0,\n\t\t"source": source,\n', 1)
          if not all(x in t for x in ['visual_turn_speed', 'avatar_anchor:', '_face_visual_direction(direction, delta)', 'func _face_visual_direction', '"visualFacingYaw"']):
              raise SystemExit('FIRST FAILURE: facing patch incomplete')
          p.write_text(t)

          p = Path('scripts/pocketpt/pocketpt_phone_flow.gd')
          t = p.read_text()
          anchor = '''\tif action == "SET_LOCOMOTION_MODE":\n\t\tvar mode := str(message.get("mode", ""))\n\t\tif context != str(state["context"]) or not _player.set_locomotion_mode(mode): return false\n\t\tstate["last_action"] = action\n\t\tstate["incoming_sequence"] = sequence\n\t\tstate["movementMode"] = mode\n\t\t_publish()\n\t\treturn true\n'''
          if 'action == "PLAY_ACTION"' not in t:
              addition = anchor + '''\tif action == "PLAY_ACTION":\n\t\tvar action_name := str(message.get("name", ""))\n\t\tif context != str(state["context"]) or context != "GYM_NAVIGATION" or action_name != "ThrillerPart1":\n\t\t\treturn false\n\t\tif _locomotion_animator == null:\n\t\t\treturn false\n\t\t_player.stop_navigation()\n\t\t_clear_navigation_command()\n\t\tif not _locomotion_animator.request_action(&"ThrillerPart1"):\n\t\t\treturn false\n\t\t_requested_motion_action = ""\n\t\tstate["last_action"] = action\n\t\tstate["incoming_sequence"] = sequence\n\t\t_publish()\n\t\treturn true\n'''
              if anchor not in t: raise SystemExit('FIRST FAILURE: Thriller insertion point missing')
              t = t.replace(anchor, addition, 1)
          t = t.replace('_locomotion_animator.play_action(&"action/ThrillerPart1")', '_locomotion_animator.request_action(&"ThrillerPart1")')
          if '_locomotion_animator.request_action(&"ThrillerPart1")' not in t: raise SystemExit('FIRST FAILURE: Thriller request action missing')
          p.write_text(t)
          PY

      - name: Write validator
        shell: bash
        run: |
          set -euo pipefail
          cat > tools/verify_live_locomotion_fix.gd <<'GDSCRIPT'
          extends SceneTree

          func _initialize() -> void:
          	call_deferred("_run")

          func _run() -> void:
          	var locomotion := load("res://game/animations/player/player_locomotion_library.tres") as AnimationLibrary
          	if locomotion == null: return _fail("LOCOMOTION_LIBRARY_MISSING")
          	for name in [&"Idle", &"Walk", &"Run"]:
          		if not locomotion.has_animation(name): return _fail("MISSING_%s" % String(name).to_upper())
          	var walk := locomotion.get_animation(&"Walk")
          	var animated_tracks := 0
          	for track_index in walk.get_track_count():
          		if walk.track_get_key_count(track_index) > 1 and walk.track_get_type(track_index) in [Animation.TYPE_ROTATION_3D, Animation.TYPE_POSITION_3D]: animated_tracks += 1
          	if walk.get_track_count() < 10 or animated_tracks < 10: return _fail("WALK_NOT_ANIMATED tracks=%d animated=%d" % [walk.get_track_count(), animated_tracks])
          	var actions := load("res://game/animations/player/player_action_library.tres") as AnimationLibrary
          	if actions == null: return _fail("ACTION_LIBRARY_MISSING")
          	print("ACTION_KEYS: ", actions.get_animation_list())
          	if not actions.has_animation(&"ThrillerPart1"): return _fail("THRILLER_LIBRARY_KEY_MISSING")
          	var thriller := actions.get_animation(&"ThrillerPart1")
          	if thriller.get_track_count() < 10: return _fail("THRILLER_TRACKS_%d" % thriller.get_track_count())
          	print("LIVE_LOCOMOTION_FIX: PASS walk_tracks=%d walk_animated_tracks=%d thriller_tracks=%d" % [walk.get_track_count(), animated_tracks, thriller.get_track_count()])
          	quit(0)

          func _fail(reason: String) -> void:
          	push_error("LIVE_LOCOMOTION_FIX: FAIL " + reason)
          	quit(1)
          GDSCRIPT

      - name: Download Godot 4.5.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.5.1-stable_linux*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Import resources
        run: '"$GODOT_BIN" --headless --editor --path "$GITHUB_WORKSPACE" --quit'

      - name: Replace broken Walk from approved target native source
        run: '"$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script res://tools/replace_walk_from_blender.gd'

      - name: Validate repaired source
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script res://tools/verify_live_locomotion_fix.gd
          grep -q '_face_visual_direction(direction, delta)' player.gd
          grep -q '_locomotion_animator.request_action(&"ThrillerPart1")' scripts/pocketpt/pocketpt_phone_flow.gd

      - name: Commit repaired source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player.gd scripts/pocketpt/pocketpt_phone_flow.gd game/animations/player/player_locomotion_library.tres tools/verify_live_locomotion_fix.gd
          git diff --cached --stat
          git commit -m "Fix visual Walk facing and expose Thriller action"
          git push origin HEAD:fix/walk-facing-thriller-20260913
