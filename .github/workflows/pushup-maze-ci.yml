name: Push-Up Maze Practice Gate

on:
  pull_request:
    paths:
      - "Main.tscn"
      - "main.gd"
      - "export_presets.cfg"
      - "scripts/games/pushup_maze_practice.gd"
      - "scripts/games/pushup_maze_diagnostic_bridge.gd"
      - "scripts/pocketpt/pocketpt_bootstrap.gd"
      - "scripts/pocketpt/pocketpt_bridge_debug.gd"
      - "tests/pushup_maze_practice_test.gd"
      - "tests/pushup_maze_diagnostic_bridge_test.gd"
      - "tests/pocketpt_startup_isolation_test.gd"
      - ".github/workflows/pushup-maze-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pushup-maze-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Godot project
        uses: actions/checkout@v4

      - name: Download Godot 4.5.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.5.1-stable_linux*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Install Godot Web export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.5.1.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -R /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          test -f "$TEMPLATE_DIR/web_release.zip"

      - name: Import project resources and class cache
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Parse startup and maze scripts
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --check-only -s res://main.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --check-only -s res://scripts/pocketpt/pocketpt_bootstrap.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --check-only -s res://scripts/pocketpt/pocketpt_bridge_debug.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --check-only -s res://scripts/games/pushup_maze_practice.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --check-only -s res://scripts/games/pushup_maze_diagnostic_bridge.gd

      - name: Protect startup isolation regression
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tests/pocketpt_startup_isolation_test.gd

      - name: Run maze structure regression
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tests/pushup_maze_practice_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tests/pushup_maze_diagnostic_bridge_test.gd

      - name: Protect phone control regression
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tests/pocketpt_phone_flow_test.gd

      - name: Protect multiplayer regression
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tests/pocketpt_multiplayer_test.gd

      - name: Protect visual-facing regression
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" -s res://tests/player_visual_facing_test.gd

      - name: Export Web smoke candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/pr-web-smoke
          mkdir -p build/pr-web-smoke
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --export-release "Web" build/pr-web-smoke/index.html
          for file in index.html index.js index.pck index.wasm; do
            test -s "build/pr-web-smoke/$file"
          done
          echo "Web export smoke PASS"
