name: Build PR3 Final Joystick

on:
  push:
    branches:
      - feat/joystick-vector-control-v2-20260913
    paths:
      - .github/workflows/build-pr3-final-joystick.yml

permissions:
  contents: write

jobs:
  patch_test_commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR3 branch
        uses: actions/checkout@v4
        with:
          ref: feat/joystick-vector-control-v2-20260913

      - name: Apply vector-navigation protocol
        run: python3 .github/scripts/apply_pr3_joystick.py

      - name: Download Godot 4.5.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.5.1-stable_linux*' | head -n 1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Run joystick and locomotion regressions
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script res://tests/pocketpt_phone_flow_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script res://tests/player_locomotion_library_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script res://tests/player_visual_facing_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script res://tools/verify_live_locomotion_fix.gd

      - name: Commit validated joystick protocol
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/pocketpt/pocketpt_phone_flow.gd tests/pocketpt_phone_flow_test.gd
          git diff --cached --check
          git commit -m "Add negotiated 360 joystick vector control [skip ci]"
          git push origin HEAD:feat/joystick-vector-control-v2-20260913
