name: Generate Canonical Avatar Rest Profile

on:
  push:
    branches:
      - fix/avatar-arm-rest-retarget-20260914
    paths:
      - .github/workflows/generate-canonical-rest-profile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/avatar-arm-rest-retarget-20260914
      - name: Download Godot 4.5.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 8 --retry-delay 3 --retry-all-errors -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.5.1-stable_linux*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Import project resources
        run: "$GODOT_BIN --headless --editor --path \"$GITHUB_WORKSPACE\" --quit"
      - name: Generate canonical rest profile
        run: "$GODOT_BIN --headless --path \"$GITHUB_WORKSPACE\" -s res://tools/generate_canonical_rest_profile.gd"
      - name: Validate profile and commit
        shell: bash
        run: |
          set -euo pipefail
          test -s resources/pocketpt/canonical_avatar_rest_profile.json
          grep -F '"LeftForeArm"' resources/pocketpt/canonical_avatar_rest_profile.json
          grep -F '"RightForeArm"' resources/pocketpt/canonical_avatar_rest_profile.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/pocketpt/canonical_avatar_rest_profile.json
          git commit -m "Add canonical avatar rest-basis profile"
          git push origin HEAD:fix/avatar-arm-rest-retarget-20260914
