name: Fix PR2 Review Findings

on:
  push:
    branches:
      - fix/walk-facing-thriller-20260913
    paths:
      - .github/workflows/fix-pr2-review-findings.yml

permissions:
  contents: write

jobs:
  fix_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR2
        uses: actions/checkout@v4
        with:
          ref: fix/walk-facing-thriller-20260913

      - name: Apply review fixes
        run: python3 .github/scripts/fix_pr2_review_findings.py

      - name: Download Godot 4.5.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.5.1-stable_linux*' | head -n 1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Run PR2 regressions
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script res://tests/pocketpt_phone_flow_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script res://tests/player_locomotion_library_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script res://tests/player_visual_facing_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script res://tools/verify_live_locomotion_fix.gd

      - name: Commit validated PR2 fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player.gd scripts/pocketpt/pocketpt_locomotion_animator.gd scripts/pocketpt/pocketpt_phone_flow.gd tests/player_locomotion_library_test.gd tests/player_visual_facing_test.gd
          git diff --cached --check
          git commit -m "Harden action rebind and fallback facing [skip ci]"
          git push origin HEAD:fix/walk-facing-thriller-20260913

# rerun after correcting mutable signal assertion
