name: Build Live Acceptance Fix

on:
  push:
    branches:
      - fix/live-walk-facing-debug-20260913
    paths:
      - .github/workflows/build-live-acceptance-fix.yml

permissions:
  contents: write

jobs:
  patch_test_commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout live-fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/live-walk-facing-debug-20260913

      - name: Apply source fixes
        run: python3 .github/scripts/apply_live_acceptance_fix.py

      - name: Download Godot 4.5.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.5.1-stable_linux*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Build visible Walk from proven Run gait
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script res://tools/build_live_walk_from_run.gd

      - name: Run locomotion acceptance regressions
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script res://tests/player_walk_quality_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script res://tests/player_visual_facing_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script res://tests/player_locomotion_library_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script res://tests/pocketpt_dynamic_avatar_animation_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script res://tests/pocketpt_phone_flow_test.gd
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script res://tools/verify_live_locomotion_fix.gd

      - name: Commit validated live fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player.gd scripts/pocketpt/pocketpt_bridge_debug.gd game/animations/player/player_locomotion_library.tres tests/player_visual_facing_test.gd tests/player_walk_quality_test.gd
          git diff --cached --check
          git commit -m "Fix live Walk gait facing and web debug panel [skip ci]"
          git push origin HEAD:fix/live-walk-facing-debug-20260913
